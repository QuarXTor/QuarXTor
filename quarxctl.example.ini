# QuarXTor canonical example config.
# This file is the primary reference for all INI options.
# Rules:
#   - Any new QuarxConfig fields MUST be reflected here in the matching section.
#   - Comments here MUST stay in sync with:
#       * core-rs/src/config.rs doc comments
#       * docs/config-reference.md (see below)
#   - Keys/sections in this file MUST remain parseable by quarxctl / QuarxConfig.
#
# Users are expected to copy/modify this file for their deployments.
# All paths must be absolute; "~" is expanded to $HOME when provided.

[core]
# L0 chunk size in bytes for new data blocks (default 16384 = 16 KiB).
# Smaller → more chunks, finer dedup but more metadata/overhead.
# Larger  → fewer chunks, coarser dedup but less overhead.
l0_chunk = 16384

# RAM tier policy for in-memory cache (RamStore).
# "full" = no explicit limit (unbounded mode, current default).
# Future values like "limit"/"auto" will enable bounded/automatic RAM limits.
ram.limit = full

# Enable ZNode / cheap-size analysis during import and repo operations.
# When disabled, the engine may skip building structural Z-nodes.
analysis.enable_znode = true

# When no cheap-size is available, fall back to computing real file sizes.
# true  = slower but accurate FS stats (read objects and count bytes).
# false = faster scans, but size field may stay 0.
analysis.fs_stats_fallback = true

# Path to repository (canonical source)
repo_root = ~/SOURCE-DB

[import]
# Minimum file size (bytes) to import.
#   0       — import everything
#   >0      — skip tiny junk (icons, tiny configs)
# Default: 4096
min_file_size = 4096

# Root of the source tree to import.
# - repo_root must NOT be equal to this path.
# - repo_root must NOT reside inside this path.
# - Internal paths like [paths].data_dir/cache_dir/log_dir/runtime_dir
#   must NOT be placed under this directory.
# Optional: if unset, import tools expect an explicit path via CLI.
#root = /mnt/source-tree

# Filters by FS object type:
#   skip_hidden   — skip hidden files/dirs (start with '.')
#   skip_symlink  — do not follow symlinks
#   skip_zero     — ignore zero-sized files
#   skip_devices  — ignore special devices (block/char)
#   skip_special  — ignore sockets/pipes and other special types
# Defaults:
#   skip_hidden   = false
#   skip_symlink  = true
#   skip_zero     = true
#   skip_devices  = true
#   skip_special  = true
skip_hidden   = false
skip_symlink  = true
skip_zero     = true
skip_devices  = true
skip_special  = true

# include_glob / exclude_glob — filename filters.
# Format: CSV list of patterns compatible with globset:
#   *.so,*.exe,*.iso
#
# include_glob:
#   - if set, only files matching patterns are imported
#   - if not set, all files are imported (except explicitly excluded)
#
# exclude_glob:
#   - files matching these patterns are excluded even if included
#
# Defaults:
#   include_glob = "*.so,*.exe,*.iso"
#   exclude_glob = (not set)
include_glob = *.so,*.exe,*.iso
#exclude_glob = *.tmp,*.log,*.bak

# include_dir_glob / exclude_dir_glob — same filters for directories.
# Use to limit/exclude entire subfolders:
#   include_dir_glob = src,include
#   exclude_dir_glob = .git,node_modules
#
# Default: not set (directories not filtered by name).
#include_dir_glob  = src,include
#exclude_dir_glob = .git,node_modules

# import_glob_mode:
#   file-only — apply include/exclude only to files (default)
#   dir-only  — apply only to directories
#   both      — apply to files and directories
# Default: file-only
import_glob_mode = file-only

# Z compression on import:
#   use_z:
#       true  — try to pack structural block ranges (Z-blocks)
#       false — load raw blocks without structural compression
#
#   z_threshold:
#       usefulness threshold for Z compression (heuristic, integer >= 0)
#       higher → more aggressive trimming of ineffective Z-blocks
# Defaults:
#   use_z       = true
#   z_threshold = 10
use_z = true
z_threshold = 10

[paths]
# Optional base directories for repository layout.
# Recommended pattern:
#   - data_dir: base directory for repo data
#   - cache_dir/log_dir/runtime_dir: separate from the imported source tree
# IMPORTANT:
#   None of these may reside inside [import].root if it is set.
#   QuarxConfig::validate() will reject such configurations.
#data_dir    = /var/lib/quarxtor
#cache_dir   = /var/cache/quarxtor
#log_dir     = /var/log/quarxtor
#runtime_dir = /run/quarxtor


[net]
# Canonical listen address for quarxnetd:
#   addr = HOST:PORT
#
# If not set:
#   - quarxnetd uses 127.0.0.1:54721 (via resolve_addr())
#   - clients (quarxnet-* and future quarxctl net-* commands) too
#
# Recommended default:
#   0.0.0.0:54721 — listen on all interfaces (for LAN/cluster)
addr = 0.0.0.0:54721

# (reserved for future)
# TLS / encryption:
#tls = false
#
# idle_timeout_ms — idle connection timeout
#idle_timeout_ms = 30000
#
# max_connections — max simultaneous connections
#max_connections = 1024


[drive]
# Section for quarxdrive / filesystem mounts.
# Currently drive reads only core/import (via QuarxConfig),
# but here will land:
#
#   mountpoint       — mount point path (FUSE / passthrough)
#   strategy         — caching / overlay policy (ram/fs/net)
#   fs_cache_bytes   — cache limit at FS level
#
# Examples — future:
#mountpoint     = /mnt/quarxtor
#strategy       = ram+disk
#fs_cache_bytes = 1073741824   # 1 GiB


[daemon]
# Shared section for background daemons:
#   netd    — quarxnetd (Net API)
#   cloudd  — cluster/cloud layer
#   drived  — drive daemon (mount management, prefetch)
#
# Flags not used yet in code, reserved.
#enable_netd          = true
#enable_cloudd        = false
#enable_drive_daemon  = false


[cloud]
# Section for QuarXCloud cluster/cloud layer.
# Still stub, but will have:
#
#   seed_nodes         — list of candidate nodes for bootstrap cluster
#   replication_factor — target replication factor
#   heartbeat_ms       — heartbeat period between nodes
#
# Examples:
#seed_nodes = node1:54721,node2:54721
#replication_factor = 2
#heartbeat_ms = 500
