[package]
name = "quarxdrive"
version = "0.1.0"
edition = "2021"

[lib]
name = "quarxdrive"
path = "src/lib.rs"

[dependencies]
serde   = { version = "1", features = ["derive"] }
bincode = "1"
blake3 = "1"
uuid = { version = "1", features = ["v4"] }
quarxtor-core = { path = "../core-rs" }
smallvec      = "1"
globset       = "0.4"
quarxproto    = { path = "../quarxproto" }
