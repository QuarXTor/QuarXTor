###############################################################################
# QuarXTor canonical config (v2)
#
# Общий INI-файл для:
#   - quarxctl
#   - quarxnetd (Net API)
#   - core-rs / quarxdrive (импорт / анализ)
#
# Путь по умолчанию (Linux):
#   $XDG_CONFIG_HOME/quarxtor/quarxctl.ini
#   или $HOME/.config/quarxtor/quarxctl.ini
#
# Рекомендуется скопировать этот файл:
#   mkdir -p ~/.config/quarxtor
#   cp tools/quarxctl/quarxctl.example.ini ~/.config/quarxtor/quarxctl.ini
#
# Термины:
#   repo_root   — КОРЕНЬ HGSS/QuarXTor-репозитория (где живёт само хранилище)
#   import.root — исходный каталог, который мы "кваркуем" (host FS → repo)
#
# Важно:
#   repo_root и import.root ДОЛЖНЫ быть разными путями.
#   Иначе репозиторий начнёт "есть сам себя" при импорте.
###############################################################################

[paths]
# Базовые директории экосистемы QuarXTor.
# Эти пути используются как "якоря" для всех модулей (core/net/drive/cloud).
#
# Linux (user scope):
#   data_dir    — устойчивые данные (репозитории, метаданные, БД)
#   cache_dir   — кэш, который можно безопасно удалить
#   log_dir     — логи
#   runtime_dir — runtime-артефакты (сокеты, pid-файлы и пр.)
#
# Windows / другие ОС:
#   рекомендуется маппить по аналогии:
#     data_dir    ≈ %LOCALAPPDATA%\QuarXTor\data
#     cache_dir   ≈ %LOCALAPPDATA%\QuarXTor\cache
#     log_dir     ≈ %LOCALAPPDATA%\QuarXTor\logs
#     runtime_dir ≈ %LOCALAPPDATA%\QuarXTor\runtime   (или temp + subdir)
#
# Значения ниже — пример под пользователя "jee" (под себя переписать).

data_dir    = /home/jee/.local/share/quarxtor
cache_dir   = /home/jee/.cache/quarxtor
log_dir     = /home/jee/.local/share/quarxtor/logs
runtime_dir = /run/user/1000/quarxtor


[core]
# === CORE / HGSS ===
#
# l0_chunk — базовый размер L0-блоков (в байтах).
# Важен для:
#   - мелкоблочной дедупликации
#   - структуры хэш-графа
#   - эффективности RAM-кеша
#
# Тип: целое положительное, степень двойки предпочтительна.
# Практический диапазон:
#   4096–65536 (4 KiB — 64 KiB)
#
# По умолчанию: 16384 (16 KiB)
l0_chunk = 16384

# Режим использования RAM:
#   full  — использовать всю доступную RAM (ram_limit_bytes = u64::MAX)
#   limit — ограничиваться ram_limit_bytes
#   auto  — зарезервировано под эвристики (пока ведёт себя как full)
#
# Тип: строка (full|limit|auto)
# По умолчанию: full
ram.limit = full

# Жёсткий лимит RAM (в байтах), если ram.limit = "limit".
#   0          — не задан / авто
#   u64::MAX   — эквивалент full
#   любое > 0  — явный предел памяти для RAM-слоя
#
# Сейчас это поле в коде присутствует, но может частично игнорироваться;
# оставлено на будущее, чтобы не ломать формат.
#ram_limit_bytes = 0

# Включение структурного анализа Z-блоков:
#
# analysis.enable_znode:
#   true  — включить анализ структурных Z-блоков
#   false — вести себя как "сырое" блочное хранилище
#
# analysis.fs_stats_fallback:
#   true  — если нет сохранённых статистик, пытаться восстановить их по FS
#   false — не использовать FS-статистику как fallback
#
# Эти флаги нужны для анализа/отладки и могут меняться с развитием ядра.
#
# По умолчанию:
#   analysis.enable_znode       = true
#   analysis.fs_stats_fallback  = true
analysis.enable_znode = true
analysis.fs_stats_fallback = true

# repo_root — КОРЕНЬ HGSS/QuarXTor-репозитория.
#
# Это НЕ источник данных, а МЕСТО, где живёт САМО хранилище:
#   - pagefile/arena (блоки)
#   - индексы/таблицы
#   - словари
#   - служебные файлы репозитория
#
# Семантика:
#   - Если repo_root указывает на ФАЙЛ:
#       этот файл трактуется как единый репозиторий (pagefile).
#   - Если repo_root указывает на ДИРЕКТОРИЮ:
#       внутри неё создаётся стандартный файл репозитория, напр. "repo.hgss".
#       Конкретное имя и структура — деталь реализации FileBlockStore.
#
# Важно:
#   repo_root ДОЛЖЕН отличаться от import.root.
#
# Рекомендуемый дефолт (Linux):
#   repo_root = ~/.local/share/quarxtor/repo
#
# Ниже — пример под пользователя "jee" (обязательно переписать под себя).
repo_root = /home/jee/.local/share/quarxtor/repo


[import]
# === Импорт из host-файловой системы ===
#
# import.root — исходный каталог для "кваркования".
# Это дерево файлов, из которого данные будут импортироваться в repo_root.
#
# Примеры:
#   root = /home/jee/SOURCE-DB            # один общий каталог
#   root = /mnt/data/media                # медиа-архив
#
# Важно:
#   - import.root ≠ core.repo_root
#   - Желательно, чтобы import.root не лежал внутри data_dir/log_dir/cache_dir.
#
# Ниже — пример под пользователя "jee".
root = /home/jee/SOURCE-DB

# Минимальный размер файла (байты) для импорта.
#   0       — импортировать всё подряд
#   >0      — отфильтровать мелкий мусор (tiny-конфиги, иконки и т.п.)
#
# Практический дефолт: 4 KiB
min_file_size = 4096

# Фильтры по типам объектов файловой системы:
#
#   skip_hidden   — пропускать скрытые файлы/директории (начинаются с '.')
#   skip_symlink  — не заходить по symlink'ам
#   skip_zero     — игнорировать файлы нулевого размера
#   skip_devices  — игнорировать спецустройства (block/char)
#   skip_special  — игнорировать сокеты/pipe и прочие "особые" типы
#
# По умолчанию (рекомендовано):
#   skip_hidden   = false   (считывать .git, .config и пр. по желанию)
#   skip_symlink  = true
#   skip_zero     = true
#   skip_devices  = true
#   skip_special  = true
skip_hidden   = false
skip_symlink  = true
skip_zero     = true
skip_devices  = true
skip_special  = true

# include_glob / exclude_glob — текстовые фильтры по имени файлов.
#
# Формат: CSV-список паттернов (glob), совместимых с globset:
#   *.so,*.exe,*.iso
#
# include_glob:
#   - если задан, импортируются только файлы, подходящие под паттерны
#   - если не задан, импортируются все (кроме явно исключённых)
#
# exclude_glob:
#   - файлы, попавшие под эти паттерны, исключаются даже если включены
#
# По умолчанию:
#   include_glob = "*.so,*.exe,*.iso"
#   exclude_glob = (не задан)
include_glob = *.so,*.exe,*.iso
#exclude_glob = *.tmp,*.log,*.bak

# include_dir_glob / exclude_dir_glob — аналогичные фильтры для директорий.
#
# Можно использовать для грубого ограничения дерева импорта:
#   include_dir_glob = src,include
#   exclude_dir_glob = .git,node_modules
#
# По умолчанию: не заданы (директории не фильтруются по имени).
#include_dir_glob  = src,include
#exclude_dir_glob = .git,node_modules

# import_glob_mode:
#   file-only — применять include/exclude только к файлам (дефолт)
#   dir-only  — применять только к директориям
#   both      — применять и к файлам, и к директориям
#
# По умолчанию: file-only
import_glob_mode = file-only

# Z-компрессия / структурное сжатие при импорте:
#
#   use_z:
#       true  — пытаться строить структурные Z-блоки
#       false — писать "сырые" блоки без структурной компрессии
#
#   z_threshold:
#       порог "выгодности" Z-компрессии (эвристический, целое >= 0)
#       чем выше, тем агрессивнее отсечение малоэффективных Z-блоков
#
# По умолчанию:
#   use_z       = true
#   z_threshold = 10
use_z = true
z_threshold = 10


[net]
# === Сетевой слой quarxnetd ===
#
# addr — canonical listen-адрес для quarxnetd:
#   addr = HOST:PORT
#
# Если не задано:
#   - quarxnetd использует 127.0.0.1:54721 (через resolve_addr())
#   - клиенты (quarxnet-* и будущие команды quarxctl net-*) тоже ориентируются
#     на этот адрес по умолчанию.
#
# Варианты:
#   127.0.0.1:54721 — только локально (отладка, single-node)
#   0.0.0.0:54721   — слушать на всех интерфейсах (LAN/cluster)
addr = 127.0.0.1:54721

# Резерв под TLS / шифрование / лимиты:
#
#tls = false
#idle_timeout_ms = 30000
#max_connections = 1024


[drive]
# === QuarXDrive / файловые монтирования ===
#
# Секция для поведения "виртуальной FS" над репозиторием.
# Пока drive читает только core/import (через QuarxConfig),
# но сюда поедут:
#
#   mountpoint     — путь точки монтирования (FUSE / passthrough / WinFSP)
#   strategy       — политика кеширования / overlay (ram/fs/net)
#   fs_cache_bytes — лимит кеша на уровне виртуальной FS
#
# Примеры (на будущее):
#mountpoint     = /mnt/quarxtor
#strategy       = ram+disk
#fs_cache_bytes = 1073741824   # 1 GiB


[daemon]
# === Общие настройки демонов ===
#
# Секция для фоновых компонентов:
#   netd    — quarxnetd (Net API)
#   cloudd  — кластерный/облачный слой (QuarXCloud)
#   drived  — фоновой демон drive (mount менеджмент, prefetch)
#
# Пока флаги не используются напрямую кодом, но формат резервируется.
#
#enable_netd          = true
#enable_cloudd        = false
#enable_drive_daemon  = false


[cloud]
# === QuarXCloud / кластерный слой (зарезервировано) ===
#
# seed_nodes         — список узлов для bootstrap кластера
# replication_factor — целевой фактор репликации
# heartbeat_ms       — период heartbeat-сообщений между нодами
#
# Примеры (на будущее):
#seed_nodes = node1:54721,node2:54721
#replication_factor = 2
#heartbeat_ms = 500
