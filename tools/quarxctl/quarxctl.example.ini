###############################################################################
# QuarXTor canonical config (v2)
#
# Shared INI file for:
#   - quarxctl
#   - quarxnetd (Net API)
#   - core-rs / quarxdrive (import / analysis)
#
# Default path (Linux):
#   $XDG_CONFIG_HOME/quarxtor/quarxctl.ini
#   or $HOME/.config/quarxtor/quarxctl.ini
#
# Recommended: copy this file:
#   mkdir -p ~/.config/quarxtor
#   cp tools/quarxctl/quarxctl.example.ini ~/.config/quarxtor/quarxctl.ini
#
# Terms:
#   repo_root   - ROOT of the HGSS/QuarXTor repo (where storage lives)
#   import.root - source directory to ingest (host FS -> repo)
#
# Important:
#   repo_root and import.root MUST be different paths.
#   Otherwise the repo will ingest itself during import.
###############################################################################

[paths]
# Base directories for the QuarXTor ecosystem.
# These paths are used as anchors for all modules (core/net/drive/cloud).
#
# Linux (user scope):
#   data_dir    - durable data (repos, metadata, DB)
#   cache_dir   - cache that is safe to delete
#   log_dir     - logs
#   runtime_dir - runtime artifacts (sockets, pid files, etc.)
#
# Windows / other OS:
#   map similarly:
#     data_dir    ~ %LOCALAPPDATA%\QuarXTor\data
#     cache_dir   ~ %LOCALAPPDATA%\QuarXTor\cache
#     log_dir     ~ %LOCALAPPDATA%\QuarXTor\logs
#     runtime_dir ~ %LOCALAPPDATA%\QuarXTor\runtime   (or temp + subdir)
#
# Values below are an example for user "jee" (adjust for your user).

data_dir    = /home/jee/.local/share/quarxtor
cache_dir   = /home/jee/.cache/quarxtor
log_dir     = /home/jee/.local/share/quarxtor/logs
runtime_dir = /run/user/1000/quarxtor


[core]
# === CORE / HGSS ===
#
# l0_chunk - base size of L0 blocks (bytes).
# Important for:
#   - fine-grained deduplication
#   - hash-graph structure
#   - RAM cache efficiency
#
# Type: positive integer, power of two preferred.
# Practical range:
#   4096-65536 (4 KiB - 64 KiB)
#
# Default: 16384 (16 KiB)
l0_chunk = 16384

# RAM usage mode:
#   full  - use all available RAM (ram_limit_bytes = u64::MAX)
#   limit - limit to ram_limit_bytes
#   auto  - reserved for heuristics (currently behaves like full)
#
# Type: string (full|limit|auto)
# Default: full
ram.limit = full

# Hard RAM limit (bytes) when ram.limit = "limit".
#   0          - unset / auto
#   u64::MAX   - equivalent to full
#   any > 0    - explicit RAM cap for the RAM tier
#
# This field exists in code but may be partially ignored;
# kept for forward compatibility without breaking format.
#ram_limit_bytes = 0

# Enable structural Z-block analysis:
#
# analysis.enable_znode:
#   true  - enable structural Z-block analysis
#   false - behave like a raw block store
#
# analysis.fs_stats_fallback:
#   true  - if saved stats are missing, rebuild them from the FS
#   false - do not use FS stats as a fallback
#
# These flags are for analysis/debug and may change with core evolution.
#
# Default:
#   analysis.enable_znode       = true
#   analysis.fs_stats_fallback  = true
analysis.enable_znode = true
analysis.fs_stats_fallback = true

# repo_root - ROOT of the HGSS/QuarXTor repository.
#
# This is NOT the data source; it is where the storage lives:
#   - pagefile/arena (blocks)
#   - indexes/tables
#   - dictionaries
#   - repository service files
#
# Semantics:
#   - If repo_root points to a FILE:
#       that file is treated as a single repository (pagefile).
#   - If repo_root points to a DIRECTORY:
#       a default repository file is created inside it, e.g. "repo.hgss".
#       Exact name/layout is a FileBlockStore implementation detail.
#
# Important:
#   repo_root MUST be different from import.root.
#
# Recommended default (Linux):
#   repo_root = ~/.local/share/quarxtor/repo
#
# Below is an example for user "jee" (adjust for your user).
repo_root = /home/jee/.local/share/quarxtor/repo


[import]
# === Import from host filesystem ===
#
# import.root - source directory to ingest.
# This is the file tree that will be imported into repo_root.
#
# Examples:
#   root = /home/jee/SOURCE-DB            # one shared directory
#   root = /mnt/data/media                # media archive
#
# Important:
#   - import.root != core.repo_root
#   - Prefer keeping import.root outside data_dir/log_dir/cache_dir.
#
# Below is an example for user "jee".
root = /home/jee/SOURCE-DB

# Minimum file size (bytes) for import.
#   0       - import everything
#   >0      - filter out tiny noise (configs, icons, etc.)
#
# Practical default: 4 KiB
min_file_size = 4096

# Filters by filesystem object type:
#
#   skip_hidden   - skip hidden files/dirs (start with '.')
#   skip_symlink  - do not follow symlinks
#   skip_zero     - ignore zero-size files
#   skip_devices  - ignore device files (block/char)
#   skip_special  - ignore sockets/pipes and other special types
#
# Defaults (recommended):
#   skip_hidden   = false   (read .git, .config, etc. if desired)
#   skip_symlink  = true
#   skip_zero     = true
#   skip_devices  = true
#   skip_special  = true
skip_hidden   = false
skip_symlink  = true
skip_zero     = true
skip_devices  = true
skip_special  = true

# include_glob / exclude_glob - text filters by file name.
#
# Format: CSV list of glob patterns (globset-compatible):
#   *.so,*.exe,*.iso
#
# include_glob:
#   - if set, only files matching patterns are imported
#   - if unset, all files are imported (except explicitly excluded)
#
# exclude_glob:
#   - files matching these patterns are excluded even if included
#
# Default:
#   include_glob = "*.so,*.exe,*.iso"
#   exclude_glob = (unset)
include_glob = *.so,*.exe,*.iso
#exclude_glob = *.tmp,*.log,*.bak

# include_dir_glob / exclude_dir_glob - similar filters for directories.
#
# Can be used to limit the import tree:
#   include_dir_glob = src,include
#   exclude_dir_glob = .git,node_modules
#
# Default: unset (directories are not filtered by name).
#include_dir_glob  = src,include
#exclude_dir_glob = .git,node_modules

# import_glob_mode:
#   file-only - apply include/exclude to files only (default)
#   dir-only  - apply to directories only
#   both      - apply to both files and directories
#
# Default: file-only
import_glob_mode = file-only

# Z-compression / structural compression on import:
#
#   use_z:
#       true  - try to build structural Z-blocks
#       false - write raw blocks without structural compression
#
#   z_threshold:
#       profitability threshold for Z-compression (heuristic, integer >= 0)
#       higher means more aggressive filtering of low-value Z-blocks
#
# Default:
#   use_z       = true
#   z_threshold = 10
use_z = true
z_threshold = 10


[net]
# === Network layer (quarxnetd) ===
#
# addr - canonical listen address for quarxnetd:
#   addr = HOST:PORT
#
# If unset:
#   - quarxnetd uses 127.0.0.1:54721 (via resolve_addr())
#   - clients (quarxnet-* and future quarxctl net-*) use it by default
#
# Options:
#   127.0.0.1:54721 - local only (debug, single-node)
#   0.0.0.0:54721   - listen on all interfaces (LAN/cluster)
addr = 127.0.0.1:54721

# Reserved for TLS / encryption / limits:
#
#tls = false
#idle_timeout_ms = 30000
#max_connections = 1024


[drive]
# === QuarXDrive / filesystem mounts ===
#
# Section for "virtual FS" behavior over the repository.
# For now, drive reads only core/import (via QuarxConfig),
# but future settings will live here:
#
#   mountpoint     - mount point path (FUSE / passthrough / WinFSP)
#   strategy       - caching / overlay policy (ram/fs/net)
#   fs_cache_bytes - cache limit for the virtual FS layer
#
# Examples (future):
#mountpoint     = /mnt/quarxtor
#strategy       = ram+disk
#fs_cache_bytes = 1073741824   # 1 GiB


[daemon]
# === Daemon settings (shared) ===
#
# Section for background components:
#   netd    - quarxnetd (Net API)
#   cloudd  - cluster/cloud layer (QuarXCloud)
#   drived  - drive daemon (mount management, prefetch)
#
# Flags are not used directly in code yet; format is reserved.
#
#enable_netd          = true
#enable_cloudd        = false
#enable_drive_daemon  = false


[cloud]
# === QuarXCloud / cluster layer (reserved) ===
#
# seed_nodes         - node list for cluster bootstrap
# replication_factor - target replication factor
# heartbeat_ms       - heartbeat interval between nodes
#
# Examples (future):
#seed_nodes = node1:54721,node2:54721
#replication_factor = 2
#heartbeat_ms = 500
